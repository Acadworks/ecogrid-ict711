name: EcoGrid fitness functions

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # nightly 02:00 Sri Lanka time

jobs:
  pr-gates:                   # fast, static + small dynamic checks on every PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Maintainability - lint + cyclomatic complexity <= 10
        run: ruff check .
      - name: Maintainability/evolvability - bounded-context import contracts
        run: lint-imports
      - name: Security - static analysis (0 high-severity findings)
        run: bandit -r ecogrid -lll
      - name: Security - dependency vulnerabilities in project dependencies (0 known)
        run: pip-audit .
      - name: Financial integrity, security, contracts, architecture
        run: pytest -m "not performance" -v

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly-performance:       # heavier dynamic checks: not on every PR
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ingestion throughput regression (>= 250 readings/s sustained)
        run: pytest -m performance -v
